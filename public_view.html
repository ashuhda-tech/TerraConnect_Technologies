    function getAgeString(dateStr) {
        if (!dateStr || dateStr === "---") return "";
        const b = new Date(dateStr);
        if (isNaN(b.getTime())) return "";

        const today = new Date();
        let years = today.getFullYear() - b.getFullYear();
        let months = today.getMonth() - b.getMonth();

        if (today.getDate() < b.getDate()) {
            months--;
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        if (years < 0) return ""; 

        let ageStr = "";
        if (years > 0) ageStr += `${years} yrs `;
        if (months > 0 || years === 0) ageStr += `${months} mos `;
        
        return ageStr ? ageStr.trim() + " | " : "";
    }
    
    // --- REVERSE GEOCODING ---
    async function getGeocodedLocation(lat, lon) {
    try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`);
        const data = await response.json();
        
        if (data && data.address) {
            const city = data.address.city || data.address.town || data.address.municipality || "Unknown City";
            const state = data.address.state || "Unknown State";
            const country = data.address.country || "Unknown Country";
            return `${city}, ${state} - ${country}`;
        }
    } catch (error) {
        console.warn("Geocoding failed, falling back to raw coordinates.", error);
    }
    return `${lat}, ${lon}`; 
}
    
    function filterLayoutByAnimal(animalType) {
    const type = animalType.toUpperCase().trim();
    document.querySelectorAll('[data-hide-for]').forEach(el => {
        const excludedTypes = el.getAttribute('data-hide-for').toUpperCase().split(',');
        if (excludedTypes.includes(type)) {
            el.remove();
        }
    });
    document.querySelectorAll('[data-show-for]').forEach(el => {
        const allowedTypes = el.getAttribute('data-show-for').toUpperCase().split(',');
        if (!allowedTypes.includes(type)) {
            el.remove();
        }
    });
}

}

    function parseCSV(str) {
        const arr = [];
        let quote = false;
        let col = 0, row = 0;

        for (let c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';

            if (cc === '"' && quote && nc === '"') {
                arr[row][col] += cc; 
                ++c; 
                continue;
            }
            if (cc === '"') {
                quote = !quote; 
                continue;
            }
            if (cc === ',' && !quote) {
                ++col; 
                continue;
            }
            if (cc === '\r' && nc === '\n' && !quote) {
                ++row; col = 0; ++c; continue;
            }
            if ((cc === '\n' || cc === '\r') && !quote) {
                ++row; col = 0; continue;
            }
            
            arr[row][col] += cc;
        }
        
        return arr.map(row => row.map(cell => cell.trim()));
    }

    function formatDateDisplay(dateStr) {
        if (!dateStr || dateStr === "---") return "--- / --- / ----";
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return `${String(d.getDate()).padStart(2, '0')} / ${months[d.getMonth()]} / ${d.getFullYear()}`;
    }


    // --- HISTÓRICO BIOLÓGICO E GRÁFICOS ---
    async function loadBiologicalHistory(id) {
        try {
            const res = await fetch(BIODATA_CSV_URL);
            const text = await res.text();
            const rows = parseCSV(text);
            const events = rows.filter(r => r[0] && r[0].toLowerCase() === id.toLowerCase());
            
            const lastFeeding = events.filter(e => e[2] === "Feeding").pop();
            const lastWeight = events.filter(e => e[2] === "Weighting").pop();
            const lastLength = events.filter(e => e[2] === "Length").pop();
            const lastShed = events.filter(e => e[2] === "Shedding").sort((a, b) => new Date(a[1]) - new Date(b[1])); 
        
            const sheddingProcessed = lastShed.map((event, index) => {
                if (index === 0) {
                    return { date: event[1], interval: 0 }; 
                }
                const prevDate = new Date(lastShed[index - 1][1]);
                const currDate = new Date(event[1]);
    
                const diffTime = Math.abs(currDate - prevDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
    
                return { date: event[1], interval: diffDays };
            });
            
            const lastShedResult = sheddingProcessed[sheddingProcessed.length - 1];
            if (lastShedResult) {
                document.getElementById('sumSheddingInterval').innerHTML = `${lastShedResult.interval}<span> Days</span>`; 
                document.getElementById('sumSheddingDate').innerText = `Last: ${formatDateDisplay(lastShedResult.date)}`;
            }

            if(lastFeeding) {
                document.getElementById('sumFeedingVal').innerHTML = `${lastFeeding[3]}<span> g</span>`;
                document.getElementById('sumFeedingDate').innerText = formatDateDisplay(lastFeeding[1]);
            }
            if(lastWeight) {
                document.getElementById('sumWeightVal').innerHTML = `${lastWeight[3]}<span> g</span>`;
                document.getElementById('sumWeightDate').innerText = formatDateDisplay(lastWeight[1]);
            }
            if(lastLength) {
                document.getElementById('sumLengthVal').innerHTML = `${lastLength[3]}<span> cm</span>`;
                document.getElementById('sumLengthDate').innerText = formatDateDisplay(lastLength[1]);
            }
        
            const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

            renderFeeding(events, accentColor);
            renderWeight(events, accentColor);
            renderShedding(sheddingProcessed, '#a3b18a'); 
            renderLength(events, accentColor);
        } catch (e) { console.error("Bio-Summary Error:", e); }
    }

    function getGradient(ctx, color) {
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, color + '33'); 
        gradient.addColorStop(1, color + '00'); 
        return gradient;
    }

    // --- PREDICTIVE FORECASTING ENGINE ---
function generateForecast(dataArray, numPredictions = 2) {
    if (dataArray.length < 3) return { values: [], type: 'Insufficient Data' };

    const n = dataArray.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    
    for (let i = 0; i < n; i++) {
        sumX += i;
        sumY += dataArray[i];
        sumXY += i * dataArray[i];
        sumX2 += i * i;
    }

    const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
    const b = (sumY - m * sumX) / n;
    const meanY = sumY / n;

    let sse = 0, sst = 0;
    for (let i = 0; i < n; i++) {
        const yPred = m * i + b;
        sse += Math.pow(dataArray[i] - yPred, 2);
        sst += Math.pow(dataArray[i] - meanY, 2);
    }
    const rSquared = sst === 0 ? 1 : 1 - (sse / sst);
    const variance = sst / n;

    let predictions = [];
    let method = '';

    if (rSquared > 0.65 && Math.abs(m) > 0.05) {
        method = 'Trend (Linear)';
        for (let i = 0; i < numPredictions; i++) {
            predictions.push(+(m * (n + i) + b).toFixed(1));
        }
    } else if (variance < (meanY * 0.05)) {
        method = 'Stable (Average)';
        for (let i = 0; i < numPredictions; i++) {
            predictions.push(+(meanY).toFixed(1));
        }
    } else {
        method = 'Volatile (EMA)';
        let st = dataArray[0];
        const alpha = 0.6;
        for (let i = 1; i < n; i++) {
            st = alpha * dataArray[i] + (1 - alpha) * st;
        }
        for (let i = 0; i < numPredictions; i++) {
            predictions.push(+(st).toFixed(1)); 
        }
    }

    return { values: predictions, method: method };
}

// --- UNIVERSAL CHART CONFIG BUILDER ---
function buildForecastChartConfig(labelString, dataArray, color, ctx) {
    const labels = dataArray.map(e => e[1]);
    const realValues = dataArray.map(e => parseFloat(e[3]));
    
    const forecast = generateForecast(realValues, 2);
    
    const paddedRealValues = [...realValues];
    const forecastValues = new Array(realValues.length - 1).fill(null);
    
    if (realValues.length > 0) {
        forecastValues.push(realValues[realValues.length - 1]); 
    }
    
    if (forecast.values.length > 0) {
        labels.push(`Predict 1`);
        labels.push(`Predict 2`);
        forecastValues.push(...forecast.values);
        paddedRealValues.push(null, null); 
    }

    const dynamicLabel = forecast.method ? `${labelString} [AI: ${forecast.method}]` : labelString;

    return {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: dynamicLabel,
                    data: paddedRealValues,
                    borderColor: color,
                    fill: true,
                    backgroundColor: getGradient(ctx, color),
                    tension: 0.4
                },
                {
                    label: 'Forecast',
                    data: forecastValues,
                    borderColor: '#ff5f5f', 
                    borderDash: [5, 5], 
                    fill: false,
                    tension: 0.4,
                    pointBackgroundColor: '#ff5f5f' 
                }
            ]
        },
        options: commonOptions() 
    };
}

    function commonOptions() {
    return {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
            padding: {
                bottom: 15 
            }
        },
        plugins: {
            legend: { display: false },
            tooltip: {
                callbacks: {
                    title: function(context) {
                        const rawDate = context[0].label;
                        const d = new Date(rawDate);
                        
                        if (isNaN(d)) return rawDate;

                        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                        const day = String(d.getDate()).padStart(2, '0');
                        const month = months[d.getMonth()];
                        const year = d.getFullYear();
                        
                        return `${day}/${month}/${year}`;
                    }
                }
            }
        },
        scales: {
            y: { 
                beginAtZero: true, 
                grid: { color: 'rgba(31, 41, 55, 0.5)' }, 
                ticks: { color: '#9ca3af' } 
            },
            x: { 
                ticks: { 
                    color: '#9ca3af',
                    font: {
                        size: 10
                    },
                    maxRotation: 0,
                    minRotation: 0,
                    autoSkip: true,
                    maxTicksLimit: 4, 
                    callback: function(val, index) {
                        const rawDate = this.getLabelForValue(val);
                        const d = new Date(rawDate);
                        
                    if (isNaN(d.getTime())) return ""; 

                    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = months[d.getMonth()];
                    const year = d.getFullYear();
                    
                    return `${day}/${month}/${year}`;
                    }
                } 
            }
        }
    }
};

async function loadVetVisits(id) {
    try {
        const res = await fetch(VETDATA_CSV_URL);
        const text = await res.text();
        const rows = parseCSV(text);
        
        const visits = rows.filter(r => r[0] && r[0].toLowerCase() === id.toLowerCase());
        const tbody = document.getElementById('vetTableBody');
        tbody.innerHTML = '';

        if (visits.length > 0) {
            let vetLocations = []; 

            visits.forEach(v => {
                let vetFile = "---";
                if (v[8] && v[8].trim() !== "") { 
                    let url_link = v[8].trim();
                    if (!url_link.startsWith("http")) url_link = "https://" + url_link;
                    vetFile = `<a href="${url_link}" target="_blank" style="color: var(--accent); text-decoration: none; font-weight: bold;"><i class="fas fa-link"></i> File</a>`;
                }
                let webContent = "---";
                if (v[12] && v[12].trim() !== "") {
                    let url = v[12].trim();
                    if (!url.startsWith("http")) url = "https://" + url;
                    webContent = `<a href="${url}" target="_blank" style="color: var(--accent); text-decoration: none; font-weight: bold;"><i class="fas fa-globe"></i> Site</a>`;
                }

                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <td style="padding: 10px;">${v[1]}</td>
                        <td style="padding: 10px;">${v[3]}</td>
                        <td style="padding: 10px;">${v[6]}</td>
                        <td style="padding: 10px;">${v[7]}</td>
                        <td style="padding: 10px;">${vetFile}</td>
                        <td style="padding: 10px;">${v[9]}</td>
                        <td style="padding: 10px;">${v[10]}</td>
                        <td style="padding: 10px;">${webContent}</td>
                    </tr>
                `;

                const loc = v[14];
                if (loc && loc.trim() !== "" && !vetLocations.includes(loc.trim())) {
                    vetLocations.push(loc.trim());
                }
            });

            if (vetLocations.length > 0 || (homeLat && homeLon)) {
                await updateVetMap(vetLocations);
            }
        } else {
            tbody.innerHTML = '<tr><td colspan="8" style="padding:20px; text-align:center;">No visits registered.</td></tr>';
            document.getElementById('vetMapContainer').innerHTML = ''; 
        }
    } catch (e) {
        console.error("Error loading Vet Data:", e);
    }
}

            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        L.marker([homeLat, homeLon], { icon: homeIcon })
         .addTo(vetMap)
         .bindPopup('<b>Home Base</b><br>Terrarium Location');
        
        bounds.push([homeLat, homeLon]);
    }

    const vetIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    for (let i = 0; i < vetLocationsArray.length; i++) {
        let coordsString = vetLocationsArray[i];
        
        try {
            const parts = coordsString.split(',');
            
            if (parts.length === 2) {
                const vLat = parseFloat(parts[0].trim());
                const vLon = parseFloat(parts[1].trim());

                if (!isNaN(vLat) && !isNaN(vLon)) {
                    L.marker([vLat, vLon], { icon: vetIcon })
                     .addTo(vetMap)
                     .bindPopup(`<b>Vet Clinic</b><br>Lat: ${vLat}<br>Lon: ${vLon}`);
                    
                    bounds.push([vLat, vLon]);
                }
            }
        } catch(e) {
            console.warn("Failed to plot Vet Coordinates for:", coordsString);
        }
    }

    if (bounds.length > 0) {
        vetMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
    } else {
        vetMap.setView([-23.5505, -46.6333], 10); 
    }
}

async function openChart(fieldId, label) {
    let targetID = (fieldId >= 6) ? r1ChannelId : mainChannelId;
    let targetKey = (fieldId >= 6) ? r1ReadKey : mainReadKey;
    
    let actualField = (fieldId >= 6) ? (fieldId - 5) : fieldId;

    if (!targetID) return alert("Sensor channel not configured.");

    const modal = document.getElementById('chartModal');
    document.getElementById('modalChartTitle').innerText = label.toUpperCase();
    modal.style.display = 'flex';

    try {
        const url = `https://api.thingspeak.com/channels/${targetID}/fields/${actualField}.json?api_key=${targetKey}&results=800`;
        const response = await fetch(url);
        const data = await response.json();

        const labels = data.feeds.map(feed => feed.created_at);
        const values = data.feeds.map(feed => feed[`field${actualField}`]);

        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        if (myChart) myChart.destroy();

        const ctx = document.getElementById('customChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: values,
                    borderColor: accentColor,
                    backgroundColor: accentColor + '33',
                    borderWidth: 1,
                    pointRadius: 1,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: (context) => {
                                const d = new Date(context[0].label);
                                return isNaN(d.getTime()) ? context[0].label : d.toLocaleTimeString();
                            }
                        }
                    }
                },
                scales: {
                    y: { grid: { color: '#333' }, ticks: { color: '#fff' } },
                    x: { 
                        grid: { display: false }, 
                        ticks: { 
                            color: '#fff', 
                            maxTicksLimit: 6,
                            callback: function(val) {
                                const d = new Date(this.getLabelForValue(val));
                                if (isNaN(d.getTime())) return "";
                                const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                                return `${d.getDate()}/${months[d.getMonth()]}/${d.getFullYear()}`;
                            }
                        } 
                    }
                }
            }
        });
    } catch (e) { console.error("Chart error:", e); }
}
    
    function closeChart() {
    const modal = document.getElementById('chartModal');
    modal.style.display = 'none';

    if (myChart) {
        myChart.destroy();
        myChart = null; 
    }
}

        const envConfig = envRow ? `Temp Alvo: Min ${envRow[2]}°C / Max ${envRow[1]}°C | Umidade Alvo: Min ${envRow[4]}% / Max ${envRow[3]}%` : "Não configurado.";

        const resVet = await fetch(VETDATA_CSV_URL);
        const vetRows = parseCSV(await resVet.text()).filter(r => r[0].toLowerCase() === currentPageId.toLowerCase());
        const vetHistory = vetRows.map(r => `Data: ${r[1]} | Tipo de exame: ${r[3]} | Resultados: ${r[6] || 'Nenhum'} | Observações: ${r[7] || 'Nenhuma'}`).join('\n');
        
                let tsHistory = "No telemetry data available.";

                        if (tsJson.feeds && tsJson.feeds.length > 0) {

                                return `[${date}] Air Temperature of Main sensor: ${f.field1 || '--'}°C | Air Humidity of Main sensor: ${f.field2 || '--'}% | CO2: ${f.field3 || '--'}ppm | Ground Humidity of Main sensor: ${f.field4 || '--'}% | Light intensity of Main sensor: ${f.field7 || '--'}lx`;

                        }
                    } catch(e) {

                        tsHistory = "Error retrieving telemetry.";
                    }
                }
                let rsHistory = "No telemetry data available for Remote Sensor.";
                if (r1ChannelId && r1ReadKey) {
                    try {
                        const rsUrl = `https://api.thingspeak.com/channels/${r1ChannelId}/feeds.json?api_key=${r1ReadKey}&results=100`;
                        const rsRes = await fetch(rsUrl);

                    } catch(e) {

                }

        const superPrompt = `
[STRICT SYSTEM INSTRUCTION: YOUR ENTIRE RESPONSE MUST BE EXCLUSIVELY IN ENGLISH. Do not output any word in Portuguese or any other language. If the provided context data is in another language, you must translate the insights internally and provide the final output ONLY in English.]

**Profile:**
- Name: ${animalName} (${animalType} | Scientific Name: ${scientificName} | Sex: ${sex})
- Enclosure Physical Location: ${currentLocation}
- Current Terrarium Conditions: Temp ${currTemp} | Humidity ${currHum}
- Ideal Limits Configuration: ${envConfig}

**Remote Sensor Telemetry History (Warm Zone / Thermal Regulation) - Last 100 readings:**
${rsHistory}

${bioHistory || "No biological records."}

**Task:**

Reference the environmental data with the biological and veterinary data. Is there any weight stagnation? Is the feeding frequency correlated with problems described in veterinary visits? Submit 3 topics:

1) General Health Analysis
2) Identified Correlations (Cause/Effect)

[FINAL RULE: REMEMBER TO GENERATE THE ENTIRE RESPONSE IN ENGLISH ONLY. BE EXTREMELY CONCISE. NO INTRODUCTORY OR CONCLUDING REMARKS. SKIP THE SPECIFICATIONS, JUST GIVE ME THE BOTTOM LINE]
`;

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ANALYZING COMPLEX DATA...';
        textBox.innerText = "Série histórica construída. Enviando para o Google Gemini 1.5 Flash...";

        const response = await fetch(AI_SCRIPT_URL, {
            method: 'POST',

        if(json.status === "success") {

        btn.innerHTML = '<i class="fas fa-magic"></i> RE-RUN ANALYSIS';
    }
}

    window.aiSpeechUtterances = [];

    function toggleSpeakAI() {
        const textBox = document.getElementById('aiInsightText');
        const icon = document.getElementById('speakIcon');
        const btn = document.getElementById('btnListenAI');
        
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
            window.speechSynthesis.cancel();
            window.aiSpeechUtterances = []; 
            icon.className = "fas fa-volume-up";
            btn.style.borderColor = "#a3b18a";
            btn.style.color = "#a3b18a";
            return;
        }

        const textToRead = textBox.innerText;
        if (!textToRead || textToRead.includes("Click to generate")) return;

        window.speechSynthesis.cancel();
        window.aiSpeechUtterances = [];

        const sentences = textToRead.match(/[^.!?\n]+[.!?\n]*/g) || [textToRead];

        icon.className = "fas fa-stop";
        btn.style.borderColor = "#ff5f5f";
        btn.style.color = "#ff5f5f";

        sentences.forEach((sentence, index) => {
            const chunkText = sentence.trim();
            if (chunkText === "") return;

            const utterance = new SpeechSynthesisUtterance(chunkText);
            
            utterance.lang = 'en-US'; 
            utterance.rate = 1.0;  
            utterance.pitch = 1.0; 

            window.aiSpeechUtterances.push(utterance);

            if (index === sentences.length - 1) {
                utterance.onend = function() {
                    icon.className = "fas fa-volume-up";
                    btn.style.borderColor = "#a3b18a";
                    btn.style.color = "#a3b18a";
                    window.aiSpeechUtterances = []; 
                };
            }

            utterance.onerror = function() {
                icon.className = "fas fa-volume-up";
                btn.style.borderColor = "#a3b18a";
                btn.style.color = "#a3b18a";
            };

            window.speechSynthesis.speak(utterance);
        });
    }
