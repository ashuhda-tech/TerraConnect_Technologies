<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARPIA WorldConnect - Laser Engraving Flyer</title>
    
    <!-- Fonts used in the Harpia WorldConnect ecosystem -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* 
           LASER ENGRAVING OPTIMIZATION:
           - Strictly #000000 (Black) and #FFFFFF (White)
           - No anti-aliasing tricks that create gray pixels
        */
        :root {
            --black: #000000;
            --white: #FFFFFF;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* 
           WOODEN PLAQUE PROPORTIONS (Approx 4x6 inches or A5)
        */
        .flyer-canvas {
            width: 1200px;
            height: 1600px;
            background-color: var(--white);
            color: var(--black);
            padding: 80px;
            box-sizing: border-box;
            position: relative;
            border: 2px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* Geometric Tech Borders */
        .inner-border {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 40px;
            border: 8px solid var(--black);
            pointer-events: none;
        }

        .corner-accent {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: var(--black);
        }
        .corner-accent.top-left { top: 40px; left: 40px; }
        .corner-accent.top-right { top: 40px; right: 40px; }
        .corner-accent.bottom-left { bottom: 40px; left: 40px; }
        .corner-accent.bottom-right { bottom: 40px; right: 40px; }

        /* Branding */
        .brand-logo {
            width: 250px;
            height: auto;
            margin-top: 60px;
            filter: brightness(0); /* CRITICAL FOR LASER: Forces pure black */
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 85px;
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 20px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 12px;
            margin-top: 15px;
            text-transform: uppercase;
            border-top: 4px solid var(--black);
            border-bottom: 4px solid var(--black);
            padding: 15px 0;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        /* Catchphrase / Hook */
        .hook-wrapper {
            margin: auto 0; /* Centers it dynamically in the empty space */
            padding: 0 40px;
        }

        .hook-text {
            font-family: 'Cinzel', serif;
            font-size: 65px;
            font-weight: 700;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Call To Action & QR */
        .qr-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-wrapper {
            padding: 25px;
            border: 8px solid var(--black);
            background-color: var(--white);
            margin-bottom: 30px;
        }

        .cta-text {
            font-family: 'Cinzel', serif;
            font-size: 45px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Footer / "Free" emphasis */
        .footer-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 40px;
            margin-top: 20px;
            text-transform: uppercase;
            background-color: var(--black);
            color: var(--white);
            padding: 15px 40px;
        }

        @media print {
            body { background-color: var(--white); margin: 0; padding: 0; }
            .flyer-canvas { border: none; width: 100%; height: 100%; }
        }
    </style>
</head>
<body>

    <div class="flyer-canvas">
        <div class="inner-border"></div>
        <div class="corner-accent top-left"></div>
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>
        <div class="corner-accent bottom-right"></div>

        <div style="width: 100%; z-index: 10;">
            <!-- Harpia Logo[cite: 2] -->
            <img src="https://raw.githubusercontent.com/ashuhda-tech/WorldConnect_Technologies/main/assets/IMAGE/HARPIA_LOGO_NO_BKGRD.png" class="brand-logo" alt="Harpia Logo">
            <div class="brand-title">HARPIA</div>
            <div class="brand-subtitle">WORLDCONNECT</div>
        </div>

        <div class="hook-wrapper" style="z-index: 10;">
            <div class="hook-text">
                THE BEST CARE<br>FOR YOUR BEST FRIEND.
            </div>
        </div>

        <div class="qr-section" style="z-index: 10;">
            <div class="qr-wrapper" id="qrcode"></div>
            <div class="cta-text">SCAN TO DISCOVER</div>
        </div>

        <!-- Adding the prominent 'FREE' keyword -->
        <div class="footer-text" style="z-index: 10;">
            100% FREE & OPEN-SOURCE
        </div>
    </div>

    <script>
        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), {
                text: "https://aiterraconnect.com.br/",
                width: 380, /* Slightly larger QR code since we have more space */
                height: 380,
                colorDark : "#000000",
                colorLight : "#FFFFFF",
                correctLevel : QRCode.CorrectLevel.H
            });
        };
    </script>
</body>
</html>
