    <style>
        /* DEFINIÇÃO DE TODOS OS TEMAS COM BASE NAS PALETAS DAS IMAGENS */
        :root {--bg-dark: #070b14; --sidebar-bg: #0d1117; --accent: #d1b38b; --text-light: #f4e9d8; --gray-panel: #1e1e1e; --border: #2d3139;}
        /* TECH SAVVY & FUTURISTIC */
        [data-theme="tech1"] {--bg-dark: #0B1021; --sidebar-bg: #334155; --accent: #87CEFA; --text-light: #CFFAFE; --gray-panel: #E2E8F0; --border: #334155;}
        [data-theme="tech2"] {--bg-dark: #1a1a1d; --sidebar-bg: #4e4e50; --accent: #ffff00; --text-light: #f5f5f5; --gray-panel: #2e2e2e; --border: #95a5a6;}
        [data-theme="tech3"] {--bg-dark: #56886C; --sidebar-bg: #56887D; --accent: #FFE0FF; --text-light: #FFE9FF; --gray-panel: #56887D; --border: #56886C;}
        /* PLAYFUL & VIBRANT */
        [data-theme="playful1"] {--bg-dark: #040B11; --sidebar-bg: #2D322C; --accent: #CEE056; --text-light: #F3F3F2; --gray-panel: #2D322C; --border: #EBC61D;}
        [data-theme="playful2"] {--bg-dark: #846B5A; --sidebar-bg: #CAB8A9; --accent: #D4CAC1; --text-light: #FEFCFB; --gray-panel: #FBF8F5; --border: #CAB8A9;}
        [data-theme="playful3"] {--bg-dark: #136a7a; --sidebar-bg: #408d99; --accent: #8dc6bf; --text-light: #d1e8e4; --gray-panel: #f1f7f6; --border: #408d99;}
        /* MINIMALISTIC & ELEGANT */
        [data-theme="minimalist1"] {--bg-dark: #000000; --sidebar-bg: #1a1a1a; --accent: #d7ccc8; --text-light: #f5f5f5; --gray-panel: #6d4c41; --border: #e1e8ed;}
        [data-theme="minimalist2"] {--bg-dark: #333333; --sidebar-bg: #4f4f4f; --accent: #bdb76b; --text-light: #dcdcdc; --gray-panel: #262626; --border: #e6e6fa;}
        [data-theme="minimalist3"] {--bg-dark: #212121; --sidebar-bg: #404040; --accent: #bdc3c7; --text-light: #ffffff; --gray-panel: #616161; --border: #ff5252;}
        /* NATURE-INSPIRED */
        [data-theme="nature1"] {--bg-dark: #2b2d24; --sidebar-bg: #3e3e3e; --accent: #cd853f; --text-light: #dad7cd; --gray-panel: #344e41; --border: #588157;}
        [data-theme="nature2"] {--bg-dark: #322D29; --sidebar-bg: #72383D; --accent: #AC9C8D; --text-light: #EFE9E1; --gray-panel: #D1C7BD; --border: #D9D9D9;}
        [data-theme="nature3"] {--bg-dark: #3b4d7b; --sidebar-bg: #1a2a4d; --accent: #c0c0e0; --text-light: #fef9e7; --gray-panel: #804040; --border: #e6b0aa;}

        body {background-color: var(--bg-dark); color: var(--text-light); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.5s;}
        .a70-font {font-family: 'Cinzel', serif; letter-spacing: 1px;}

        /* BARRA LATERAL */
        .sidebar {width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; transition: 0.3s;}
        .nav-section {flex-grow: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;}

        /* Cards de Ambiente */
        .ambient-card {background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 12px 15px; border-radius: 4px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s; text-decoration: none; color: var(--text-light); font-size: 0.85rem;}
        .ambient-card i {font-size: 1.1rem; color: var(--accent); width: 20px; text-align: center;}
        .ambient-card:hover {background: var(--accent); color: var(--bg-dark); transform: translateX(5px);}
        .ambient-card:hover i { color: var(--bg-dark); }

        .add-card {border: 1px dashed var(--accent); background: transparent; opacity: 0.6; margin-top: 10px;}
        .add-card:hover {opacity: 1; background: rgba(209, 179, 139, 0.1); color: var(--accent); border-style: solid;}
        
        /* BRANDING */
        .brand-logo { text-align: center; margin: 25px 0; border-top: 1px solid var(--border); padding-top: 20px; }
        .brand-logo h2 { font-size: 1rem; margin: 0; color: var(--accent); }
        .brand-logo span { font-size: 0.6rem; letter-spacing: 3px; }

        /* THEME SELECTOR CARD EXPANDIDO */
        .theme-card { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .theme-card label { font-size: 0.65rem; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; display: block; }
        
        .theme-group { display: flex; flex-direction: column; gap: 8px; }
        .theme-row { display: flex; justify-content: space-between; align-items: center; }
        .theme-row span { font-size: 0.55rem; opacity: 0.7; width: 60px; }
        .theme-options { display: flex; gap: 8px; flex-grow: 1; justify-content: flex-end; }
        
        .theme-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.3s; }
        .theme-dot:hover { transform: scale(1.3); }
        .theme-dot.active { border-color: var(--text-light); }

        /* USER CARD */
        .user-card { background: rgba(209, 179, 139, 0.05); border: 1px solid rgba(209, 179, 139, 0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .user-card label { font-size: 0.7rem; color: #9ca3af; display: block; }
        .user-card .name { font-weight: bold; font-size: 0.9rem; margin-top: 5px; display: block; }
        .user-card .id { font-family: monospace; font-size: 0.6rem; color: var(--accent); word-break: break-all; margin-top: 5px; display: block; }

        .social-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .social-links a { color: var(--text-light); font-size: 1.1rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .social-links span { font-size: 0.45rem; letter-spacing: 1px; }

        .btn-exit { background: transparent; border: 1px solid #ef4e4e; color: #ef4e4e; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 0.8rem; transition: 0.3s; }
        .btn-exit:hover { background: #ef4e4e; color: white; }

        /* PAINEL PRINCIPAL */
        /* Ajuste no Painel Principal para suportar o fundo */
        .main-panel {flex-grow: 1; margin: 20px; border-radius: 40px; display: flex; justify-content: center;  align-items: center;  border: 1px solid var(--border); 
    position: relative; /* Necessário para posicionar o fundo */
    overflow: hidden;   /* Garante que o vídeo/gif não saia das bordas arredondadas */
    background-color: #000; /* Fundo de segurança */
}

/* O Fundo (GIF ou Vídeo) */
        .panel-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; /* Preenche sem distorcer */
    z-index: 1; opacity: 0.6; /* Ajuste a opacidade para não brigar com o texto */
}

/* O Card com Efeito Glassmorphism (Referência: image_577e00.png) */
        .glass-card {  position: relative; z-index: 2; text-align: center;  padding: 60px;
    background: rgba(255, 255, 255, 0.05); /* Branco bem transparente */
    backdrop-filter: blur(15px);           /* O efeito de desfoque/vidro */
    -webkit-backdrop-filter: blur(15px);   /* Suporte para Safari */
    border: 1px solid rgba(255, 255, 255, 0.1);  border-radius: 30px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); max-width: 80%;}

/* Ajuste no conteúdo para não herdar a opacidade baixa anterior */
        .glass-card i { font-size: 5rem; margin-bottom: 20px; display: inline-block; color: var(--accent); }
        .glass-card p {font-size: 1.2rem; letter-spacing: 4px; margin: 0; color: #fff; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        .placeholder-content { text-align: center; opacity: 0.25; }
        .placeholder-content i { font-size: 8rem; margin-bottom: 20px; display: block; }
        .placeholder-content p { font-size: 1.2rem; letter-spacing: 2px; margin: 0; }
    </style>
</head>
<body>

        <div class="nav-section"></div>
         
        <div class="nav-section-bottom">

                <i class="fas fa-plus-circle"></i> ADD NEW

        <div class="brand-logo a70-font">

        <div class="theme-card">
            <label class="a70-font">Setup Appearance</label>
            <div class="theme-group">
                <div class="theme-row">
                    <span>STANDARD</span>

                    <div class="theme-options">

    <div class="main-panel">
    <!-- Fundo Dinâmico (MP4 do Google Drive) -->
    <video class="panel-background" 
        autoplay loop muted playsinline 
           poster="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/b1c4c1f080d96ec1c35ff823176f214b761eb6a6/assets/WALLPAPER_MAINDASHBOARD.png">
        <source src="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/b1c4c1f080d96ec1c35ff823176f214b761eb6a6/assets/VIDEO/RIVER_MAINDASHBOARD.mp4" type="video/mp4">

        <img src="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/b1c4c1f080d96ec1c35ff823176f214b761eb6a6/assets/WALLPAPER_MAINDASHBOARD.png" title="Seu navegador não suporta vídeos.">

    <script>
        
        // --- FIREWALL DE ACESSO ---
(function() {
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (!user) {
        window.location.href = 'index.html'; // Chuta para o login se não houver sessão
        return;
    }
    window.currentUser = user; // Define globalmente para as outras funções
})();

        document.getElementById('userName').innerText = user.name || "User";
        document.getElementById('userId').innerText = `ID: ${user.id}`;

    //TerraConnectPageID
    const PAGEID_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTeBz5FwvcmPue3hJ6TKwmrNZeMrz2_Su7co-mPuzKj1ZJv--5BBvPjlszF3yyEHOVuEeGT9mmwZqOp/pub?gid=0&single=true&output=csv';
    const PAGEID_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3LbOYDqljAxQ8joYW8yDhwe6lsi7AdFCAoi4HG1iRdglS0k9-fI1Oj2eA12ePc6g/exec";

    //TerraConnectTheme
    const THEME_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQxrbVDyA-y5qOfbXcmpyCppyTDtGxOAYzGj_QR6uA27gVY3KWeT3Ka6IYvKDUM3QiU6iK0aNq3O6wr/pub?gid=0&single=true&output=csv';
    const THEME_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPCMbwa8NXy253hSbR4ewodPAiN_20qUlwvcFl8Uexo9SOZRUp5vxDPFlksh8NyNnD/exec";
    
    //TerraConnectBiodata.xlsx
    const BIODATA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0Ra5VUE1xSCkCJCXaAObs1wBlUlrhH1YnnQ6e91S4fLT4sh_Nt7ECxaW15EMgS4_yjVcEs0OQECta/pub?gid=0&single=true&output=csv';
    const BIODATA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnOcWSHRutBkHc_45tSLOFjowJXMeplk333TmaddrvfWgETljbZZ6shOuwYTIG4AkD/exec";
        
    //TerraConnectEnviromentalSetup.xlsx
    const ENVIRONMENT_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRbjH7deMzP_-oUSROzLYUxU3o2UvBar6ODVwLKpLQ6xaacQKON5xlzV3KA2Tswsc0WfSGQu7LVKBvs/pub?gid=0&single=true&output=csv';
    const ENVIRONMENT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzG2YVem9qG7sEK20lVuRm2Bhjo10dfXRF98mibREbUZnM5obTrb0QrQDJIGi0wFoE/exec";
    

        function applyInitialTheme() {
            const savedTheme = localStorage.getItem(`theme_${user.id}`) || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        async function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem(`theme_${user.id}`, themeName);

            const finalUrl = `${THEME_SCRIPT_URL}?pageId=${encodeURIComponent(user.id)}&registerType=ThemePreference&value=${encodeURIComponent(themeName)}`;
            
            try {
                await fetch(finalUrl, { method: 'GET', mode: 'no-cors' });
                console.log("Cloud Saved Theme: ", themeName);
            } catch (e) {
                console.warn("Cloud Sync Error.");
            }
        }

        async function loadUserAmbients() {
            try {
                const response = await fetch(PAGEID_CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                const navSection = document.querySelector('.nav-section');
                navSection.innerHTML = ''; 

                rows.forEach(row => {
                    const columns = row.split(',');
                    const dbUserId = columns[0]?.trim();
                    const dbPageId = columns[1]?.trim();
                    const dbName = columns[2]?.trim();
                    const dbTheme = columns[15]?.trim(); 

                    if (dbUserId === user.id) {
                        const card = document.createElement('a');
                        card.href = `ambient_view.html?id=${dbPageId}`;
                        card.className = 'ambient-card a70-font';
                        card.innerHTML = `<i class="fas fa-microchip"></i> ${dbName.toUpperCase()}`;
                        // Ao clicar, salvamos o ID e navegamos "limpo"
                        card.onclick = () => {
                            sessionStorage.setItem('activePageId', dbPageId); 
                            window.location.href = 'ambient_view.html'; // URL fica limpa!
                        };
                        navSection.appendChild(card);
                        
                        if(dbTheme && !localStorage.getItem(`theme_${user.id}`)) {
                            setTheme(dbTheme);
                        }
                    }
                });
            } catch (error) {
                console.error("Ambient Loading Error: ", error);
            }
        }

        applyInitialTheme();
        loadUserAmbients();
        
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
