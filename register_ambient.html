<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraConnect | Registration</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="TerraConnect Technologies">
    <meta property="og:description" content="Environmental Animal IOT Monitoring Center">
    <meta property="og:url" content="https://ashuhda-tech.github.io/TerraConnect_Technologies/">
    <meta property="og:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TerraConnect Technologies">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070b14;
            --accent: #d1b38b;
            --border: #2d3139;
            --text-light: #f4e9d8;
        }

        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .register-container { background: #0d1117; padding: 40px; border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 500px; text-align: center; }
        .a70-font { font-family: 'Cinzel', serif; letter-spacing: 2px; }
        h1 { color: var(--accent); font-size: 1.2rem; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 0.7rem; color: var(--accent); display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem; }
        .info-box { background: rgba(209, 179, 139, 0.05); padding: 10px; border-radius: 4px; font-size: 0.7rem; margin-bottom: 25px; border: 1px solid rgba(209, 179, 139, 0.1); }
        .btn-save { background: var(--accent); color: var(--bg-dark); border: none; width: 100%; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; margin-top: 20px; }
        .btn-save:hover { filter: brightness(1.1); } 
        .btn-back { display: block; margin-top: 15px; color: #9ca3af; text-decoration: none; font-size: 0.8rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-full { grid-column: span 2; }
    </style>
</head>
<body>

    <div class="register-container">
        <h1 class="a70-font" id="mainTitle">REGISTRATION</h1>
        
        <div class="info-box">
            <span style="font-size: 0.6rem;">LINKED TO ID:</span>
            <strong id="displayUserId" style="font-size: 0.6rem;">---</strong>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label class="a70-font">AMBIENT NAME</label>
                <input type="text" id="ambientName" placeholder="Ex: Hela Smarthome">
            </div>
            <div class="input-group">
                <label class="a70-font">ANIMAL NAME</label>
                <input type="text" id="animalName" placeholder="Ex: Hela">
            </div>
            <div class="input-group">
                <label class="a70-font">SEX</label>
                <input type="text" id="animalSex" placeholder="Ex: Female">
            </div>
            <div class="input-group">
                <label class="a70-font">ANIMAL TYPE</label>
                <input type="text" id="animalType" placeholder="Ex: Dog, Cat, Turtle, Snake, Eagle, Jaguar...">
            </div>
            <div class="input-group">
                <label class="a70-font">SCIENTIFIC NAME</label>
                <input type="text" id="scientificName" placeholder="Ex: Lampropeltis">
            </div>
            <div class="input-group">
                <label class="a70-font">BIRTH DATE</label>
                <input type="date" id="birthDate">
            </div>
            <div class="input-group">
                <label class="a70-font">REGULATORY REGISTRATION Nº</label>
                <input type="text" id="regNumber" placeholder="IBAMA">
            </div>
            
            <div class="input-group grid-full">
                <label class="a70-font">LOCATION (LAT, LONG)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="location" placeholder="-23.55, -46.63">
                    <button type="button" onclick="getLocation()" title="Use my current location" 
                            style="background: var(--accent); border: none; border-radius: 4px; padding: 0 15px; cursor: pointer;">
                        <i class="fas fa-location-crosshairs" style="color: var(--bg-dark);"></i>
                    </button>
                </div>
            </div>
            
            <div class="input-group grid-full">
                <label class="a70-font">IMAGE URL</label>
                <input type="text" id="photoURL" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <div class="input-group grid-full">
                <label class="a70-font">ANIMAL PHOTO (MAX 1MB)</label>
                <input type="file" id="animalPhoto" accept="image/*" style="font-size: 0.7rem; border: none; background: none;">
                <canvas id="resizeCanvas" style="display:none;"></canvas>
            </div>

            <div class="info-box grid-full">
            <span style="font-size: 0.6rem;">THINGSPEAK CONFIGURATOR FOR SENSOR REGISTRATION</span>
            </div>
            
            <div class="input-group">
                <label class="a70-font">THINGSPEAK CHANNEL ID</label>
                <input type="text" id="channelID" placeholder="Ex: 1234567">
            </div>
            <div class="input-group grid-full">
                <label class="a70-font">THINGSPEAK WRITE API KEY</label>
                <input type="text" id="tsWrite" placeholder="Write Key">
            </div>
            <div class="input-group grid-full">
                <label class="a70-font">THINGSPEAK READ API KEY</label>
                <input type="text" id="tsRead" placeholder="Read Key">
            </div>
            
            <div class="info-box grid-full">
            <span style="font-size: 0.6rem;">WIFI CONFIGURATOR FOR SENSOR REGISTRATION</span>
            </div>
    
            <div class="input-group">
                <label class="a70-font">WIFI NETWORK</label>
                <input type="text" id="wifiSsid" placeholder="Write Wifi Network Name">
            </div>
            <div class="input-group grid-full">
                <label class="a70-font">WIFI PASSWORD</label>
                <input type="text" id="wifiPassword" placeholder="Wifi Password">
            </div>
            
        </div>

        <button class="btn-save a70-font" id="btnAction" onclick="processRegistration()">COMPLETE REGISTRATION</button>
        <a href="maindashboard.html" class="btn-back">CANCEL AND BACK</a>
    </div>

    
    <script>
        // URL PARA GRAVAR/REGISTRAR OS DADOS NO GOOGLE SHEETS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw3LbOYDqljAxQ8joYW8yDhwe6lsi7AdFCAoi4HG1iRdglS0k9-fI1Oj2eA12ePc6g/exec';
        
        // URL PARA LER OS DADOS EM FORMATO CSV (Convertido de pubhtml para pub?output=csv)
        const csvReadURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTeBz5FwvcmPue3hJ6TKwmrNZeMrz2_Su7co-mPuzKj1ZJv--5BBvPjlszF3yyEHOVuEeGT9mmwZqOp/pub?gid=0&single=true&output=csv';

        let isEditMode = false;
        let editingPageID = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('currentUser');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }
            const user = JSON.parse(userData);
            document.getElementById('displayUserId').innerText = user.id;
            window.currentUser = user; 
            
            const urlParams = new URLSearchParams(window.location.search);
            editingPageID = urlParams.get('pageID');

            if (editingPageID) {
                isEditMode = true;
                setupEditMode();
            }     
        });
        
        // Função auxiliar para interpretar as linhas do CSV ignorando vírgulas internas entre aspas
        function parseCSVRow(str) {
            let arr = [];
            let quote = false;
            let col = '';
            for (let i = 0; i < str.length; i++) {
                let cc = str[i], nc = str[i+1];
                if (cc === '"' && quote && nc === '"') { col += cc; i++; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { arr.push(col.trim()); col = ''; continue; }
                col += cc;
            }
            arr.push(col.trim());
            return arr;
        }

        async function setupEditMode() {
            document.getElementById('mainTitle').innerText = "EDIT REGISTRATION";
            document.getElementById('btnAction').innerText = "UPDATE REGISTRATION";
            document.getElementById('displayUserId').innerText = `EDITING: ${editingPageID}`;

            console.log("Lendo dados do arquivo CSV publicado...");

            try {
                // Realiza o Fetch do CSV (Somente para Leitura)
                const response = await fetch(csvReadURL);
                const csvText = await response.text();
                
                const rows = csvText.split('\n');
                if (rows.length < 2) return; // Retorna se não houver dados além do cabeçalho

                // Captura a primeira linha para usar como referência das colunas
                const headers = parseCSVRow(rows[0]);
                let targetRow = null;

                // Percorre o CSV para achar a linha do PageID
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    
                    const columns = parseCSVRow(rows[i]);
                    // Procura o pageID na linha atual (independente da coluna exata)
                    const foundId = columns.find(c => c === editingPageID);
                    
                    if (foundId) {
                        targetRow = columns;
                        break;
                    }
                }

                if (targetRow) {
                    console.log("Dados encontrados para o ID: ", editingPageID);
                    
                    // Helper para buscar o valor baseado no nome aproximado da coluna no cabeçalho
                    const getValue = (colName) => {
                        const idx = headers.findIndex(h => h.toLowerCase().includes(colName.toLowerCase()));
                        return idx !== -1 ? targetRow[idx] : "";
                    };

                    document.getElementById('ambientName').value = getValue('ambient') || getValue('name') || "";
                    document.getElementById('animalName').value = getValue('animalname') || getValue('animal') || "";
                    document.getElementById('animalSex').value = getValue('animalsex') || getValue('sex') || "";
                    document.getElementById('animalType').value = getValue('animaltype') || getValue('type') || "";
                    document.getElementById('scientificName').value = getValue('scientific') || "";
                    
                    let bDate = getValue('birthdate') || getValue('birth');
                    if(bDate && bDate.includes('T')) bDate = bDate.split('T')[0];
                    document.getElementById('birthDate').value = bDate || "";
                    
                    document.getElementById('regNumber').value = getValue('regnumber') || getValue('registration') || "";
                    
                    const lat = getValue('latitude') || getValue('lat') || "";
                    const lng = getValue('longitude') || getValue('long') || "";
                    const fullLoc = getValue('location');
                    
                    if (lat && lng) {
                        document.getElementById('location').value = `${lat}, ${lng}`;
                    } else if (fullLoc) {
                        document.getElementById('location').value = fullLoc;
                    }

                    document.getElementById('photoURL').value = getValue('photourl') || getValue('photo') || "";
                    document.getElementById('channelID').value = getValue('channelid') || getValue('channel') || "";
                    document.getElementById('tsWrite').value = getValue('tswrite') || getValue('write') || "";
                    document.getElementById('tsRead').value = getValue('tsread') || getValue('read') || "";
                    document.getElementById('wifiSsid').value = getValue('wifissid') || getValue('ssid') || "";
                    document.getElementById('wifiPassword').value = getValue('wifipassword') || getValue('password') || "";
                    
                } else {
                    console.warn("ID não encontrado no CSV da Planilha.");
                }

            } catch (e) {
                console.error("Erro ao fazer o fetch e leitura do CSV:", e);
                alert("Não foi possível carregar os dados antigos. Verifique sua conexão ou se a planilha está publicada corretamente.");
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const long = position.coords.longitude.toFixed(6);
                    document.getElementById('location').value = `${lat}, ${long}`;
                }, (error) => {
                    alert("Error retrieving location: " + error.message);
                });
            } else {
                alert("GPS not supported.");
            }
        }

        async function processRegistration() {
            const user = window.currentUser;
            if (!user) return alert("Session expired.");

            const ambientName = document.getElementById('ambientName').value;
            const animalName = document.getElementById('animalName').value;
            const channelID = document.getElementById('channelID').value;
            const locationRaw = document.getElementById('location').value;

            if (!ambientName || !animalName || !channelID) {
                return alert("Please fill in the Ambient Name, Animal Name, and Channel ID.");
            }

            let lat = "", lng = "";
            if (locationRaw.includes(',')) {
                const parts = locationRaw.split(',');
                lat = parts[0].trim();
                lng = parts[1].trim();
            }

            const pageId = isEditMode ? editingPageID : 'PG-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            let photoData = "";
            const fileInput = document.getElementById('animalPhoto');
            if (fileInput.files[0]) {
                photoData = await resizeImage(fileInput.files[0]);
            }

            const payload = {
                action: isEditMode ? "update" : "create",
                userID: user.id,
                pageID: pageId,
                ambientName: ambientName,
                animalName: animalName,
                animalSex: document.getElementById('animalSex').value,
                animalType: document.getElementById('animalType').value,
                scientificName: document.getElementById('scientificName').value,
                birthDate: document.getElementById('birthDate').value,
                regNumber: document.getElementById('regNumber').value,
                latitude: lat,
                longitude: lng,
                channelID: channelID,
                tsRead: document.getElementById('tsRead').value,
                tsWrite: document.getElementById('tsWrite').value,
                wifiSsid: document.getElementById('wifiSsid').value,
                wifiPassword: document.getElementById('wifiPassword').value,
                photoBase64: photoData,
                photoURL: document.getElementById('photoURL').value,
                timestamp: new Date().toLocaleString('pt-BR')
            };
            
            try {
                console.log("Enviando dados via POST para registrar: ", payload);

                // O FETCH envia os dados para gravar usando apenas o scriptURL
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                alert(`SUCCESS!\nAmbiente ${ambientName} registered/updated with ID: ${pageId}`);
                window.location.href = 'maindashboard.html';
            } catch (e) { 
                alert("Error connecting to the database.");
                console.error("Fetch Error:", e);
            }
        }

        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.getElementById('resizeCanvas');
                        const MAX_WIDTH = 300; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                };
            });
        }
    </script>
</body>
</html>
