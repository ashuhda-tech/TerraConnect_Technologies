<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraConnect | Dashboard</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="TerraConnect Technologies">
    <meta property="og:description" content="Environmental Animal IOT Monitoring Center">
    <meta property="og:url" content="https://ashuhda-tech.github.io/TerraConnect_Technologies/">

    <meta property="og:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TerraConnect Technologies">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {--bg-color: #1a1c20;--card-bg: #070b14;--accent: #d1b38b;--text: #f4e9d8; }
        body {background-color: var(--bg-color);color: var(--text);font-family: 'Segoe UI', sans-serif;display: flex;justify-content: center;align-items: center;min-height: 100vh; margin: 0;}
        .dashboard-card {background-color: var(--card-bg);padding: 40px;border-radius: 12px;border: 1px solid #1f2937;text-align: center;max-width: 500px;width: 90%;}
        h1 { color: var(--accent); margin-bottom: 10px; }
        .user-id { font-family: monospace; background: #111827; padding: 10px; border-radius: 5px; font-size: 0.8rem; margin: 20px 0; display: block; border: 1px solid #2d3139; }
        .btn-logout {background: transparent;border: 1px solid var(--accent);color: var(--accent); padding: 10px 20px;cursor: pointer;border-radius: 6px;margin-top: 20px;}
    </style>
</head>
<body>

<div class="dashboard-card">
    <i class="fas fa-user-circle fa-4x" style="color: var(--accent); margin-bottom: 20px;"></i>
    <h1>Welcome, <span id="userName">User</span>!</h1>
    <p>Your registration on the TerraConnect portal has been located.</p>
    
    <div class="user-id">
        <strong>USER_ID:</strong> <span id="userIdDisplay">Validating data...</span>
    </div>

    <p id="statusMsg" style="font-size: 0.9rem; color: #9ca3af;">Checking connection to sensors...</p>
    
    <button class="btn-logout" onclick="logout()">Exit the WebPortal</button>
</div>

<script>
    // Constants for your Environment Database
    
    //TerraConnectPageID
    const PAGEID_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTeBz5FwvcmPue3hJ6TKwmrNZeMrz2_Su7co-mPuzKj1ZJv--5BBvPjlszF3yyEHOVuEeGT9mmwZqOp/pub?gid=0&single=true&output=csv';
    const PAGEID_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3LbOYDqljAxQ8joYW8yDhwe6lsi7AdFCAoi4HG1iRdglS0k9-fI1Oj2eA12ePc6g/exec";
    
    //TerraConnect Sign up.xlsx
    const SIGNUP_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTLog7uhFw___9q5ossjzRuKZq6VkC3HqgsD52RAd1y5FigIwCqmEyFeLc-_qgS1RAwtlcIhr_zK-nn/pub?gid=0&single=true&output=csv';
    const SIGNUP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFT1YQSMLpJ2zLJQ-bD1JOUzaUJJsRcmCBkpseXd87iGvJXm5Ig7p1gYJf-PmHVwQ/exec";
        
    // 1. GESTÃO DE SESSÃO
    const user = JSON.parse(localStorage.getItem('currentUser'));

    if (!user) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('userName').innerText = user.name || "Usuário";
        document.getElementById('userIdDisplay').innerText = user.id || "---";
        
        // Inicia a busca de dados
        fetchEnvironmentData(user.id);
    }

    async function fetchEnvironmentData(userId) {
        const statusMsg = document.getElementById('statusMsg');
        
        try {
            statusMsg.innerText = "Synchronizing User data...";
            
            // Busca os dois arquivos simultaneamente
            const [envRes, subRes] = await Promise.all([
                fetch(`${PAGEID_CSV_URL}&t=${new Date().getTime()}`),
                fetch(`${SIGNUP_URL}&t=${new Date().getTime()}`)
            ]);

            const envData = await envRes.text();
            const subData = await subRes.text();
            
            const envRows = parseCSV(envData);
            const subRows = parseCSV(subData);

            // 1. Encontra Sensor Data (Source: PAGEID_CSV)
            // Assumindo row[1] = UserID, row[10] = ChannelID, row[12] = APIKey
            const userEnv = envRows.find(row => row[0] && row[0].trim() === userId);

            // 2. Encontra Sub/Plan Data (Source: SIGNUP_URL)
            // Assumindo row[3] = UserID, row[4] = PlanType
            const userSubs = subRows.find(row => row[3] && row[3].trim() === userId);

            if (userEnv && userSubs) {
                // 1. DATA EXTRACTION
                const expiryDateStr = userSubs[5] || "01/01/2000"; // Default to old date if empty
        
                // 2. EXPIRATION CHECK
                if (!isPlanValid(expiryDateStr)) {
                    statusMsg.innerHTML = '<span style="color: #ef4e4e;">Access Denied: Your plan expired on ' + expiryDateStr + '.</span>';
                    return; // Stops here, no redirect
                }
                // 3. SUCCESS - PROCEED
                // Atualiza o objeto do usuário com os dados de AMBOS os excels
                user.channelId = userEnv[12];
                user.apiKey = userEnv[14];
                user.planType = userSubs[4] || "0"; // Default to level 0 if not set
                user.planValidDate = expiryDateStr;

                // Salva o objeto atualizado no localStorage
                localStorage.setItem('currentUser', JSON.stringify(user));

                statusMsg.innerText = "Data located! Redirecting...";
                statusMsg.style.color = "#48bb3a";
                
                setTimeout(() => { window.location.href = 'maindashboard.html'; }, 1000);
            } else {
                statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error: No environment configuration found for this user.</span>';
            }

        } catch (e) {
            console.error("Fetch Error:", e);
            statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error connecting to the data server.</span>';
        }
    }

    // Função de auxílio para ler o CSV
    function parseCSV(str) {
        const arr = [];
        let quote = false;
        let col = 0, row = 0;
        for (let c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';
            if (cc === '"') { quote = !quote; continue; }
            if (cc === ',' && !quote) { ++col; continue; }
            if ((cc === '\n' || cc === '\r') && !quote) { ++row; col = 0; continue; }
            arr[row][col] += cc;
        }
        return arr.map(r => r.map(c => c.trim()));
    }

    // --- HELPER FUNCTION: DATE VALIDATION ---
    function isPlanValid(dateStr) {
        if (dateStr.toUpperCase() === "LIFETIME") return true;
        
        // Parse DD/MM/YYYY
        const parts = dateStr.split('/');
        if (parts.length !== 3) return false;
        
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1; // Month is 0-11
        const year = parseInt(parts[2], 10);
        
        const expiryDate = new Date(year, month, day);
        const today = new Date();
        
        // Return true if today is before or equal to expiry date
        return today <= expiryDate;
    }

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
