    <style>
        :root {--bg-color: #1a1c20;--card-bg: #070b14;--accent: #d1b38b;--text: #f4e9d8; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
            margin: 0;
        }

        .content-wrapper {
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .app-version-flag {position: fixed;bottom: 10px;left: 10px;background: rgba(0, 0, 0, 0.6);color: rgba(255, 255, 255, 0.3);padding: 4px 8px;border-radius: 4px;font-size: 0.55rem;font-family: 'Inter', monospace;z-index: 99999;pointer-events: none;border: 1px solid rgba(255, 255, 255, 0.1);backdrop-filter: blur(2px);transition: opacity 0.5s;}
        
        .dashboard-card {background-color: var(--card-bg);padding: 40px;border-radius: 12px;border: 1px solid #1f2937;text-align: center;max-width: 500px;width: 100%;}
        h1 { color: var(--accent); margin-bottom: 10px; }
        .user-id { font-family: monospace; background: #111827; padding: 10px; border-radius: 5px; font-size: 0.8rem; margin: 20px 0; display: block; border: 1px solid #2d3139; }
        .btn-logout {background: transparent;border: 1px solid var(--accent);color: var(--accent); padding: 10px 20px;cursor: pointer;border-radius: 6px;margin-top: 20px; transition: 0.3s;}
        .btn-logout:hover {background: var(--accent); color: var(--card-bg);}

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border, #2d3139);
            position: relative;
            z-index: 100; 
            box-sizing: border-box;
            flex-shrink: 0; 
        }
        .footer-text {font-size: 0.8rem;color: #9ca3af;font-family: 'Inter', sans-serif;letter-spacing: 0.5px;}
        .footer-link {color: var(--accent); text-decoration: none;font-weight: 600;transition: color 0.3s ease;margin-left: 5px;}
        .footer-link:hover {color: var(--text); }
        
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="dashboard-card">
            <i class="fas fa-user-circle fa-4x" style="color: var(--accent); margin-bottom: 20px;"></i>
            <h1>Welcome, <span id="userName">User</span>!</h1>
            <p>Your registration on the TerraConnect portal has been located.</p>
            
            <div class="user-id">
                <strong>USER_ID:</strong> <span id="userIdDisplay">Validating data...</span>
            </div>

            <p id="statusMsg" style="font-size: 0.9rem; color: #9ca3af;">Checking connection to secure servers...</p>
            
            <button class="btn-logout" onclick="logout()">Exit the WebPortal</button>
        </div>
    </div>
    
    <footer>
        <div class="footer-text">
            Copyright &copy; 2026 TerraConnect Technologies. All Rights Reserved. | 
            <a href="license.html" class="footer-link"><i class="fas fa-balance-scale"></i> Open-Use License</a>
        </div>
    </footer>

<script>
    // Master Directory URL encoded in Base64
    const MASTER_DIRECTORY_B64 = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J6cTRZVWUzWjJQeGNsdlJtRWNxaVF1bk1KRXRXNVE5cmxOV21KOXF6RWdQcWM5OVVlVThud3VjYm91SFdzaE1Bdy9leGVj'; 

    let signupScriptUrl = "";
    let pageIdScriptUrl = "";

    async function fetchDatabaseRoutes() {
        console.log("[DEBUG] Fetching database routes from Master Directory...");
        try {
            const payload = { pageName: "home.html" };
            const masterUrl = atob(MASTER_DIRECTORY_B64);
            console.log("[DEBUG] Master Directory URL decoded:", masterUrl);

            const response = await fetch(masterUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            console.log("[DEBUG] Master Directory response received:", result);
            
            if (result.status === "success") {
                const rawSignUp = result.data["TerraConnect_SignUp"];
                const rawPageId = result.data["TerraConnect_PageID"];
                
                console.log("[DEBUG] Raw TerraConnect_SignUp from Master:", rawSignUp);
                console.log("[DEBUG] Raw TerraConnect_PageID from Master:", rawPageId);

                if (!rawSignUp || !rawPageId) {
                    console.error("[ERROR] Missing database URL in Master Directory response for home.html. Check Column F (WebPagesUsingDatabase) in your spreadsheet!");
                    return false;
                }

                signupScriptUrl = atob(rawSignUp); 
                pageIdScriptUrl = atob(rawPageId);
                
                console.log("[DEBUG] Decoded SignUp URL:", signupScriptUrl);
                console.log("[DEBUG] Decoded PageID URL:", pageIdScriptUrl);
                return true;
            } else {
                console.error("[ERROR] Routing Access Denied by Master Script:", result.message);
                return false;
            }
        } catch (error) {
            console.error("[ERROR] Failed to connect to Master Directory:", error);
            return false;
        }
    }

    async function initHome() {
        console.log("[DEBUG] Initializing home.html session check...");
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const authToken = sessionStorage.getItem('authToken');
        const statusMsg = document.getElementById('statusMsg');

        if (!user || !authToken) {
            console.warn("[WARN] No active user or auth token found. Redirecting to index.html.");
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('userName').innerText = user.name || "Usuário";
        document.getElementById('userIdDisplay').innerText = user.id || "---";

        statusMsg.innerText = "Connecting to Master Directory...";

        const routesLoaded = await fetchDatabaseRoutes();
        if (!routesLoaded || !signupScriptUrl || !pageIdScriptUrl) {
            console.error("[ERROR] Route loading failed or returned empty URLs.");
            statusMsg.innerHTML = '<span style="color: #ef4e4e;">System configuration error: Failed to load secure routes.</span>';
            return;
        }

        fetchEnvironmentData(user.id, authToken);
    }

    async function fetchEnvironmentData(userId, token) {
        const statusMsg = document.getElementById('statusMsg');
        
        try {
            statusMsg.innerText = "Authenticating and syncing User data...";
            console.log("[DEBUG] Fetching user plan from SignUp script:", signupScriptUrl);
            
            const planRes = await fetch(`${signupScriptUrl}?action=get_plan&userId=${encodeURIComponent(userId)}&authToken=${encodeURIComponent(token)}`);
            const planData = await planRes.json();
            console.log("[DEBUG] Plan data received:", planData);

            if (planData.status !== "success" || planData.active === false) {
                console.warn("[WARN] User plan inactive or invalid:", planData);
                statusMsg.innerHTML = '<span style="color: #ef4e4e;">Access Denied: Your plan is expired or invalid. Please check your subscription.</span>';
                return; 
            }

            console.log("[DEBUG] Fetching user pages from PageID script:", pageIdScriptUrl);
            const envRes = await fetch(`${pageIdScriptUrl}?action=get_user_pages&userID=${encodeURIComponent(userId)}&authToken=${encodeURIComponent(token)}`);
            const envData = await envRes.json();
            console.log("[DEBUG] Environment pages received:", envData);

            if (envData.status === "success" && envData.data.length > 0) {
                const firstEnv = envData.data[0];
                
                user.channelId = firstEnv[12]; 
                user.apiKey = firstEnv[14];    
                user.planType = planData.plan; 
                user.planValidDate = "Validated Server-Side"; 

                localStorage.setItem('currentUser', JSON.stringify(user));

                statusMsg.innerText = "Data located and secured! Redirecting...";
                statusMsg.style.color = "#48bb3a";
                console.log("[DEBUG] Synchronization complete. Redirecting to maindashboard.html...");
                
                setTimeout(() => { window.location.href = 'maindashboard.html'; }, 1000);
            } else {
                console.warn("[WARN] No environment configuration found in envData:", envData);
                statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error: No environment configuration found for this user.</span>';
            }

        } catch (e) {
            console.error("[ERROR] Exception caught inside fetchEnvironmentData:", e);
            statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error connecting to the secure data server.</span>';
        }
    }

    function logout() {
        console.log("[DEBUG] Logging out user, clearing local storage and session token.");
        localStorage.removeItem('currentUser');
        sessionStorage.removeItem('authToken');
        window.location.href = 'index.html';
    }

    async function fetchGitHubVersion() {
        const flagElement = document.getElementById('gh-version-flag');
        if (!flagElement) return;

        const repoUrl = 'https://api.github.com/repos/ashuhda-tech/TerraConnect_Technologies/commits?per_page=1';

        try {
            const response = await fetch(repoUrl);
            
            if (response.ok) {
                const data = await response.json();
                const latestCommit = data[0];
                
                const shortSha = latestCommit.sha.substring(0, 7);
                const commitDate = new Date(latestCommit.commit.author.date);
                const formattedDate = `${String(commitDate.getDate()).padStart(2, '0')}/${String(commitDate.getMonth() + 1).padStart(2, '0')}/${commitDate.getFullYear()}`;

                flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Build ${shortSha} (${formattedDate})`;
            } else {
                flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Live Build`;
            }
        } catch (error) {
            flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Local Build`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initHome();
        fetchGitHubVersion();
    });
</script>
    <div id="gh-version-flag" class="app-version-flag">
        <i class="fas fa-spinner fa-spin"></i> Fetching Build...
    </div>
</body>
</html>
