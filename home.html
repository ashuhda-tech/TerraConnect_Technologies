<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraConnect | Dashboard</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGO.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="TerraConnect Technologies">
    <meta property="og:description" content="Environmental Animal IOT Monitoring Center">
    <meta property="og:url" content="https://ashuhda-tech.github.io/TerraConnect_Technologies/">

    <meta property="og:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TerraConnect Technologies">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/ashuhda-tech/TerraConnect_Technologies/78ffcf4a572347f28b01389a97030d0b88dc6b0f/TERRACONNECT_LOGOBRAND.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {--bg-color: #1a1c20;--card-bg: #070b14;--accent: #d1b38b;--text: #f4e9d8; }
        
        /* 
           CORREÇÃO 1: Ajuste do Body
           Removemos o alinhamento central daqui e adicionamos flex-direction: column 
           para que os blocos da página se empilhem verticalmente. 
        */
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column; /* Empilha o wrapper e o footer verticalmente */
            min-height: 100vh; 
            margin: 0;
        }

        /* 
           CORREÇÃO 2: Wrapper do Conteúdo
           O flex-grow: 1 faz essa div preencher todo o espaço vazio da tela,
           empurrando o footer lá para baixo. Aqui colocamos as regras
           de centralização para manter o card no meio da tela.
        */
        .content-wrapper {
            flex-grow: 1; /* Ocupa o espaço livre */
            display: flex;
            justify-content: center; /* Centraliza o card horizontalmente */
            align-items: center; /* Centraliza o card verticalmente */
            padding: 20px; /* Garante que o card não encoste nas bordas em telas muito pequenas */
            box-sizing: border-box;
        }

        /* --- APP VERSION FLAG --- */
        .app-version-flag {position: fixed;bottom: 10px;left: 10px;background: rgba(0, 0, 0, 0.6);color: rgba(255, 255, 255, 0.3);padding: 4px 8px;border-radius: 4px;font-size: 0.55rem;font-family: 'Inter', monospace;z-index: 99999;pointer-events: none;border: 1px solid rgba(255, 255, 255, 0.1);backdrop-filter: blur(2px);transition: opacity 0.5s;}
        
        .dashboard-card {background-color: var(--card-bg);padding: 40px;border-radius: 12px;border: 1px solid #1f2937;text-align: center;max-width: 500px;width: 100%;}
        h1 { color: var(--accent); margin-bottom: 10px; }
        .user-id { font-family: monospace; background: #111827; padding: 10px; border-radius: 5px; font-size: 0.8rem; margin: 20px 0; display: block; border: 1px solid #2d3139; }
        .btn-logout {background: transparent;border: 1px solid var(--accent);color: var(--accent); padding: 10px 20px;cursor: pointer;border-radius: 6px;margin-top: 20px; transition: 0.3s;}
        .btn-logout:hover {background: var(--accent); color: var(--card-bg);}

        /* ----- GLOBAL FOOTER ----- */
        /*
           CORREÇÃO 3: Ajuste do Footer
           Removi a margem gigante (margin-top) já que o flex-grow acima 
           já empurra o footer perfeitamente para o fundo.
        */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border, #2d3139); /* Usei um fallback color caso a variável não exista aqui */
            position: relative;
            z-index: 100; 
            box-sizing: border-box;
            flex-shrink: 0; /* Impede o footer de encolher */
        }
        .footer-text {font-size: 0.8rem;color: #9ca3af;font-family: 'Inter', sans-serif;letter-spacing: 0.5px;} /* Troquei a variável --text-muted direto pela cor para evitar conflito caso não declarada no :root deste arquivo */
        .footer-link {color: var(--accent); text-decoration: none;font-weight: 600;transition: color 0.3s ease;margin-left: 5px;}
        .footer-link:hover {color: var(--text); }
        
    </style>
</head>
<body>

    <!-- 
       CORREÇÃO 4: HTML Structure
       O dashboard-card agora fica "abraçado" pela div content-wrapper.
    -->
    <div class="content-wrapper">
        <div class="dashboard-card">
            <i class="fas fa-user-circle fa-4x" style="color: var(--accent); margin-bottom: 20px;"></i>
            <h1>Welcome, <span id="userName">User</span>!</h1>
            <p>Your registration on the TerraConnect portal has been located.</p>
            
            <div class="user-id">
                <strong>USER_ID:</strong> <span id="userIdDisplay">Validating data...</span>
            </div>

            <p id="statusMsg" style="font-size: 0.9rem; color: #9ca3af;">Checking connection to secure servers...</p>
            
            <button class="btn-logout" onclick="logout()">Exit the WebPortal</button>
        </div>
    </div>
    
    <!-- GLOBAL FOOTER (Fica fora do wrapper central) -->
    <footer>
        <div class="footer-text">
            Copyright &copy; 2026 TerraConnect Technologies. All Rights Reserved. | 
            <a href="license.html" class="footer-link"><i class="fas fa-balance-scale"></i> Open-Use License</a>
        </div>
    </footer>

<script>
    // Constants for your Secure Environment Database (NO MORE CSV URLs)
    const PAGEID_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3LbOYDqljAxQ8joYW8yDhwe6lsi7AdFCAoi4HG1iRdglS0k9-fI1Oj2eA12ePc6g/exec";
    const SIGNUP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFT1YQSMLpJ2zLJQ-bD1JOUzaUJJsRcmCBkpseXd87iGvJXm5Ig7p1gYJf-PmHVwQ/exec";
        
    // 1. GESTÃO DE SESSÃO
    const user = JSON.parse(localStorage.getItem('currentUser'));

    if (!user) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('userName').innerText = user.name || "Usuário";
        document.getElementById('userIdDisplay').innerText = user.id || "---";
        
        // Inicia a busca segura de dados no servidor
        fetchEnvironmentData(user.id);
    }

    async function fetchEnvironmentData(userId) {
        const statusMsg = document.getElementById('statusMsg');
        
        try {
            statusMsg.innerText = "Authenticating and syncing User data...";
            
            // 1. Valida o Plano diretamente no Backend (Oculta a data de expiração do usuário)
            const planRes = await fetch(`${SIGNUP_SCRIPT_URL}?action=get_plan&userId=${encodeURIComponent(userId)}`);
            const planData = await planRes.json();

            if (planData.status !== "success" || planData.active === false) {
                statusMsg.innerHTML = '<span style="color: #ef4e4e;">Access Denied: Your plan is expired or invalid. Please check your subscription.</span>';
                return; // Trava o redirecionamento aqui
            }

            // 2. Busca de forma segura os Ambientes que pertencem SOMENTE a este usuário
            const envRes = await fetch(`${PAGEID_SCRIPT_URL}?action=get_user_pages&userID=${encodeURIComponent(userId)}`);
            const envData = await envRes.json();

            if (envData.status === "success" && envData.data.length > 0) {
                
                // Mapeia os dados baseados no código legado 
                const firstEnv = envData.data[0];
                
                user.channelId = firstEnv[12]; // MainTsRead
                user.apiKey = firstEnv[14];    // R1TsWrite
                user.planType = planData.plan; // Plano processado pelo servidor
                user.planValidDate = "Validated Server-Side"; // Não expomos mais no LocalStorage

                // Atualiza a sessão
                localStorage.setItem('currentUser', JSON.stringify(user));

                statusMsg.innerText = "Data located and secured! Redirecting...";
                statusMsg.style.color = "#48bb3a";
                
                setTimeout(() => { window.location.href = 'maindashboard.html'; }, 1000);
            } else {
                statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error: No environment configuration found for this user.</span>';
            }

        } catch (e) {
            console.error("Fetch Error:", e);
            statusMsg.innerHTML = '<span style="color: #ef4e4e;">Error connecting to the secure data server.</span>';
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    }

    // ==========================================
    // --- GITHUB AUTO VERSION TRACKER ---
    // ==========================================
    async function fetchGitHubVersion() {
        const flagElement = document.getElementById('gh-version-flag');
        if (!flagElement) return;

        // URL da API pública do GitHub apontando para os commits do seu repositório
        const repoUrl = 'https://api.github.com/repos/ashuhda-tech/TerraConnect_Technologies/commits?per_page=1';

        try {
            const response = await fetch(repoUrl);
            
            if (response.ok) {
                const data = await response.json();
                const latestCommit = data[0];
                
                // Pega os 7 primeiros caracteres do hash do commit (Padrão de versão)
                const shortSha = latestCommit.sha.substring(0, 7);
                
                // Pega a data e formata
                const commitDate = new Date(latestCommit.commit.author.date);
                const formattedDate = `${String(commitDate.getDate()).padStart(2, '0')}/${String(commitDate.getMonth() + 1).padStart(2, '0')}/${commitDate.getFullYear()}`;

                flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Build ${shortSha} (${formattedDate})`;
            } else {
                // Se o GitHub limitar as requisições (Rate Limit)
                flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Live Build`;
            }
        } catch (error) {
            // Se houver erro de rede
            flagElement.innerHTML = `<i class="fas fa-code-branch"></i> Local Build`;
        }
    }

    // Chama a função assim que a página carrega
    document.addEventListener('DOMContentLoaded', fetchGitHubVersion);
    </script>
<!-- VERSION FLAG -->
    <div id="gh-version-flag" class="app-version-flag">
        <i class="fas fa-spinner fa-spin"></i> Fetching Build...
    </div>
</body>
</html>
